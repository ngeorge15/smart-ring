<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ring">
<meta name="theme-color" content="#08090b">
<title>Ring</title>
<style>
/* ---------------------------------------------------------------------------
   Dark-first. Two ideas borrowed from Oura's 2026 system:
   (1) SEMANTIC COLOR -- the score arc is coloured by body state, not a fixed
       brand hue, and always ships with a text label so colour never carries
       meaning alone.
   (2) PROGRESSIVE DISCLOSURE -- rings/bars at a glance, detail on tap.
   Data marks use the validated categorical palette; gradients and glow are
   chrome only and never encode a value.
--------------------------------------------------------------------------- */
:root{
  color-scheme: dark;
  --plane:#08090b; --surface-1:#111419; --surface-2:#181c23; --raise:#1e232b;
  --ink:#f7f8fa; --ink-2:#aab2be; --muted:#69717e;
  --grid:#222831; --axis:#2b323c;
  --deep:#3987e5; --light:#d95926; --rem:#199e70; --awake:#3a4049;
  --brand:#3987e5; --brand-soft:#86b6ef;
  --good:#0ca30c; --warning:#fab219; --critical:#d03b3b;
  --r:20px; --r-sm:13px;
}
:root[data-theme="light"]{
  color-scheme: light;
  --plane:#f2f2ef; --surface-1:#fcfcfb; --surface-2:#f6f6f3; --raise:#eeede9;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e4e3dc; --axis:#c3c2b7;
  --deep:#2a78d6; --light:#eb6834; --rem:#1baf7a; --awake:#c3c2b7;
  --brand:#2a78d6; --brand-soft:#5598e7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--plane);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 44px);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
.wrap{max-width:720px;margin:0 auto;padding:18px 15px}

/* entrance */
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.anim{animation:rise .5s cubic-bezier(.22,.75,.3,1) both}
@media (prefers-reduced-motion:reduce){
  .anim{animation:none}
  .arc,.bar i{transition:none !important}
}

header{display:flex;align-items:flex-start;justify-content:space-between;margin:6px 3px 18px}
h1{font-size:26px;margin:0;letter-spacing:-.028em;font-weight:660;line-height:1.1}
.sub{color:var(--muted);font-size:12px;margin-top:4px;letter-spacing:.005em}
#theme{background:var(--surface-2);border:1px solid var(--grid);color:var(--ink-2);
  border-radius:999px;width:36px;height:36px;font-size:15px;cursor:pointer;flex:none}
#theme:active{transform:scale(.94)}

/* ---- hero score ---- */
.hero{background:var(--surface-1);border:1px solid var(--grid);border-radius:var(--r);
  padding:26px 20px 22px;margin-bottom:12px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:50%;top:-46%;width:300px;height:300px;
  transform:translateX(-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,var(--glow,transparent) 0%,transparent 68%);
  opacity:.2}
.dial{position:relative;width:172px;height:172px;margin:0 auto}
.dial svg{transform:rotate(-90deg)}
.dial .ctr{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.dial .ctr b{font-size:52px;font-weight:640;letter-spacing:-.045em;line-height:1;
  font-variant-numeric:tabular-nums}
.dial .ctr em{font-size:10px;color:var(--muted);font-style:normal;margin-top:5px;
  text-transform:uppercase;letter-spacing:.12em;font-weight:600}
.state{text-align:center;margin-top:16px}
.state .word{font-size:16px;font-weight:600;letter-spacing:-.012em}
.state .why{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.45}
.arc{transition:stroke-dashoffset 1.25s cubic-bezier(.2,.72,.28,1)}

/* ---- secondary score row ---- */
.row2{display:flex;gap:10px;margin-bottom:12px}
.mini{flex:1;background:var(--surface-1);border:1px solid var(--grid);
  border-radius:var(--r-sm);padding:14px 12px;display:flex;align-items:center;gap:11px}
.mini .ring{position:relative;width:44px;height:44px;flex:none}
.mini .ring svg{transform:rotate(-90deg)}
.mini .ring span{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:640;font-variant-numeric:tabular-nums}
.mini .txt{min-width:0}
.mini .txt b{display:block;font-size:12.5px;font-weight:600;letter-spacing:-.006em}
.mini .txt i{display:block;font-size:11px;color:var(--muted);font-style:normal;margin-top:1px}

/* ---- cards ---- */
.card{background:var(--surface-1);border-radius:var(--r);padding:18px;margin-bottom:12px;
  border:1px solid var(--grid)}
.card h2{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);
  margin:0 0 15px;font-weight:660;display:flex;justify-content:space-between;align-items:center}
.card h2 .r{text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted)}

/* ---- contributors (progressive disclosure) ---- */
.comp{padding:12px 0;border-top:1px solid var(--grid);cursor:pointer}
.comp:first-of-type{border-top:0;padding-top:0}
.comp .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.comp .nm{font-weight:550;font-size:14.5px;text-transform:capitalize;letter-spacing:-.008em}
.comp .sc{font-variant-numeric:tabular-nums;font-weight:660;font-size:15px}
.comp .ex{color:var(--ink-2);font-size:12px;margin-top:4px}
.comp .more{max-height:0;overflow:hidden;transition:max-height .3s ease;
  font-size:11.5px;color:var(--muted);line-height:1.5}
.comp.open .more{max-height:120px;margin-top:7px}
.comp .chev{color:var(--muted);font-size:11px;transition:transform .25s}
.comp.open .chev{transform:rotate(180deg)}
.bar{height:7px;background:var(--raise);border-radius:99px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;border-radius:99px;
  transition:width 1s cubic-bezier(.2,.72,.28,1)}
.comp.off{opacity:.55;cursor:default}

/* ---- misc ---- */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);
  background:var(--surface-2);border:1px solid var(--grid);border-radius:999px;padding:5px 11px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
svg{display:block;width:100%;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:13px;font-size:11.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:14px}
th,td{text-align:right;padding:7px 4px;border-top:1px solid var(--grid)}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:660;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em}
td{color:var(--ink-2)} td b{font-variant-numeric:tabular-nums;font-weight:620;color:var(--ink)}
.note{font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.55}
.warn{border-left:2px solid var(--warning);padding-left:11px;margin:10px 0;font-size:12px;
  color:var(--ink-2);line-height:1.5}
.gap{padding:11px 0;border-top:1px solid var(--grid);font-size:12px;color:var(--ink-2);line-height:1.5}
.gap:first-of-type{border-top:0;padding-top:0}
.gap b{color:var(--ink);font-weight:620;display:block;font-size:12.5px;margin-bottom:2px}
.tiles{display:flex;gap:10px;margin-bottom:12px}
.tile{flex:1;background:var(--surface-1);border:1px solid var(--grid);
  border-radius:var(--r-sm);padding:15px}
.tile .k{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:660}
.tile .v{font-size:27px;font-weight:640;letter-spacing:-.032em;margin-top:6px;
  font-variant-numeric:tabular-nums;line-height:1}
.tile .d{font-size:11.5px;color:var(--muted);margin-top:4px}
.empty{color:var(--muted);font-size:12.5px;padding:6px 0}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--plane);
  font-size:11.5px;font-weight:560;padding:7px 10px;border-radius:8px;opacity:0;
  transition:opacity .12s;z-index:99;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="tip" id="tip"></div>
<script>
const DATA = __SNAPSHOT_JSON__;
const $=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app=document.getElementById('app'), tip=document.getElementById('tip');
const num=n=>n==null?'—':(+n).toLocaleString();
let step=0; const anim=el=>{el.classList.add('anim');el.style.animationDelay=(step++*45)+'ms';return el};

function bindTip(el,html){
  const show=e=>{const p=e.touches?e.touches[0]:e;tip.innerHTML=html;tip.style.opacity=1;
    const r=tip.getBoundingClientRect();
    tip.style.left=Math.min(Math.max(8,p.clientX-r.width/2),innerWidth-r.width-8)+'px';
    tip.style.top=Math.max(8,p.clientY-r.height-14)+'px';};
  el.addEventListener('mouseenter',show); el.addEventListener('mousemove',show);
  el.addEventListener('touchstart',show,{passive:true});
  el.addEventListener('mouseleave',()=>tip.style.opacity=0);
  el.addEventListener('touchend',()=>tip.style.opacity=0);
}

/* SEMANTIC STATE -- colour always travels with a word, never alone.
   Three bands only: 'serious' is deliberately omitted because it and 'warning'
   are the one confusable status pair. */
function band(s){
  if(s==null)            return {c:'var(--muted)',   w:'No data',        g:'transparent'};
  if(s>=70)              return {c:'var(--good)',    w:'Good',           g:'#0ca30c'};
  if(s>=40)              return {c:'var(--warning)', w:'Fair',           g:'#fab219'};
  return                        {c:'var(--critical)',w:'Needs recovery', g:'#d03b3b'};
}
const confWord=c=>c<.4?'low':c<.75?'moderate':'good';
const confColor=c=>c<.4?'var(--critical)':c<.75?'var(--warning)':'var(--good)';

/* ---------------- header ---------------- */
const span=DATA.meta.span||{}, R=DATA.readiness, d=new Date(DATA.meta.generated_at);
app.append(anim($(`<header>
  <div><h1>${d.toLocaleDateString(undefined,{weekday:'long'})}</h1>
    <div class="sub">${d.toLocaleDateString(undefined,{month:'long',day:'numeric'})}
      · synced ${d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}</div></div>
  <button id="theme" aria-label="Toggle light or dark theme">◐</button>
</header>`)));
document.getElementById('theme').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',cur);
  try{localStorage.setItem('ring-theme',cur)}catch(e){}
};
try{const t=localStorage.getItem('ring-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}

/* ---------------- hero ---------------- */
const B=band(R.score), C=2*Math.PI*76;
const driver=[...R.components].filter(c=>c.available).sort((a,b)=>a.score-b.score)[0];
const hero=anim($(`<div class="hero" style="--glow:${B.g}">
  <div class="dial">
    <svg viewBox="0 0 172 172" width="172" height="172">
      <circle cx="86" cy="86" r="76" fill="none" stroke="var(--raise)" stroke-width="11"/>
      <circle class="arc" cx="86" cy="86" r="76" fill="none" stroke="${B.c}" stroke-width="11"
        stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}"/>
    </svg>
    <div class="ctr"><b>${R.score==null?'—':Math.round(R.score)}</b><em>Readiness</em></div>
  </div>
  <div class="state">
    <div class="word" style="color:${B.c}">${B.w}</div>
    <div class="why">${driver?`Held back most by ${esc(driver.name.replace(/_/g,' '))} — ${esc(driver.explain)}`:'Not enough data yet.'}</div>
    <div class="pill" style="margin-top:12px"><i class="dot" style="background:${confColor(R.confidence)}"></i>
      ${Math.round(R.confidence*100)}% — ${confWord(R.confidence)} confidence</div>
  </div>
</div>`));
app.append(hero);
requestAnimationFrame(()=>{const a=hero.querySelector('.arc');
  if(R.score!=null)a.style.strokeDashoffset=C*(1-R.score/100);});
__CHARTS__
</script>
</body>
</html>
